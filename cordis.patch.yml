# Mount line for the dsh-ntr bundle.
#
# The pure package-name row is REQUIRED for the ClientModuleRegistry to match
# the browser half (dsh.client in package.json); the host half is the same row
# (one plugin module carries both Node and browser entries).
#
# Configure agents below (name -> command). Agent commands are ONLY ever read
# from this configuration layer — the browser can never ask the host to spawn
# an arbitrary program. Environment variables for a child are injected here
# (YAML `!!js process.env.X` is allowed) so secrets stay out of the browser.
- insert:
    - id: dsh-ntr
      name: dsh-ntr
      config:
        agents: []
        # transcriptMaxEntries: 600
        # probeModelsOnBoot: true   # set false to disable automatic model-catalog probes (manual button still works)
        # Reliability tuning (defaults shown):
        # startupTimeoutMs: 60000    # budget for initialize / session/new / session/load
        # permissionTimeoutMs: 0     # auto-cancel a pending approval after N ms (0 = wait for the human forever)
        # cancelFallbackMs: 15000    # force-finalize a turn the agent ignores after session/cancel (0 = off)
        # ACP 模式 agent preset (presets/acp) is installed into the roster's user
        # root (~/.dsh/.agent-presets/acp) on first boot; an existing preset is
        # never overwritten. Set false to keep the host out of that directory.
        # installAcpPreset: true
        # Per-agent ACP-model filter — which of the agent's models its own
        # conversation seats offer (panel checkboxes persist here). ACP models
        # are never advertised in DSH's model catalog, so they cannot leak into
        # a non-ACP conversation:
        # agents:
        #   - id: pi
        #     command: pi-acp
        #     npmPackage: pi-acp        # auto `npm install -g` when command is missing from PATH
        #     exposedModels: [model-a, model-b]   # opt-in `agent@choice` variants; unset/[] = base entry only
        #     idleTimeoutMs: 1800000     # release the process once it has been idle this long (ms)
        #                                #   with NO live session (0 = never; unset = 30 min).
        #                                #   Only session-less processes are released — model probes
        #                                #   and post-save probes are what leak them.
