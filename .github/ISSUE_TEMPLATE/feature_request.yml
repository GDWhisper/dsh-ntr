name: 功能建议
about: 提出新功能或改进（不发 bug 报告；用法提问请去 Discussions）
title: '[Feature] '
body:
  - type: markdown
    attributes:
      value: |
        提建议前请先搜一下现有 issue 和 Discussions，避免重复。
        这条入口只收功能建议。运行出错请回到「问题报告」。

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 issue 和 Discussions，没有重复
          required: true

  - type: dropdown
    id: area
    attributes:
      label: 建议归属
      description: 选最接近的一块
      options:
        - agent 进程 / ACP 协议
        - 会话绑定 / 模型与配置选项
        - 权限审批
        - 对话界面 / 设置页
        - 内置更新 / 发版
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 写清场景和现在的限制，不要只写一句功能名
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的行为 / 方案
      description: 你希望怎么用、界面或配置长什么样
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / 补充信息
      description: 现在有没有绕过去的办法，或其它上下文、截图
