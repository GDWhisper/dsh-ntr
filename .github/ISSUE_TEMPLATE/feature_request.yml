name: 功能建议 / Feature Request
description: 提出新功能或改进（不发 bug 报告；用法提问请去 Discussions） / Suggest a new feature or improvement (not for bug reports; usage questions go to Discussions)
title: '[Feature] '
body:
  - type: markdown
    attributes:
      value: |
        提建议前请先搜一下现有 issue 和 Discussions，避免重复。 / Search existing issues and Discussions first to avoid duplicates.
        这条入口只收功能建议。运行出错请回到「问题报告」。 / This form is for feature requests only. For runtime errors, use "Bug Report".

  - type: checkboxes
    id: checks
    attributes:
      label: 确认 / Confirmation
      options:
        - label: 我已搜索现有 issue 和 Discussions，没有重复 / I have searched existing issues and Discussions and found no duplicate
          required: true

  - type: dropdown
    id: area
    attributes:
      label: 建议归属 / Area
      description: 选最接近的一块 / Pick the closest area
      options:
        - agent 进程或 ACP 协议 / Agent process or ACP protocol
        - 会话绑定、模型与配置选项 / Session binding, model and config options
        - 权限审批 / Permission approvals
        - 对话界面与设置页 / Conversation UI and settings page
        - 内置更新与发版 / Built-in update and releases
        - 其他 / Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题 / Problem to solve
      description: 写清场景和现在的限制，不要只写一句功能名 / Describe the scenario and the current limitation; do not just name the feature
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的行为或方案 / Desired behavior or solution
      description: 你希望怎么用、界面或配置长什么样 / How you want to use it, and what the UI or config should look like
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案或补充信息 / Alternatives or additional context
      description: 现在有没有绕过去的办法，或其它上下文、截图 / Current workarounds, or other context and screenshots
