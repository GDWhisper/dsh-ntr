name: 问题报告
about: 报告插件运行异常（agent 启动失败、连接断开、界面异常等）
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: |
        提 issue 前请先做三件事：
        1. 看 README「常见问题」。
        2. 搜一下现有 issue，别重复提。
        3. 到设置页点对应 agent 的「测试」按钮，把结果贴到下面。

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已看过 README 常见问题，并搜索过现有 issue
          required: true
        - label: 我已用设置页「测试」按钮复现，并附上了结果
          required: true

  - type: dropdown
    id: area
    attributes:
      label: 问题归属
      description: 选最接近的一类，帮我们判断是宿主、插件还是 agent 进程的问题
      options:
        - agent 启动 / ACP 连接失败
        - 模型 / 思考等级 / 配置选项
        - 权限审批
        - 界面显示
        - 内置更新
        - 其他
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: 版本与环境
      description: dsh-ntr 版本、DSH 宿主版本、操作系统、Node 版本，例如 0.4.4 / DSH 0.1.7 / Windows 11 / Node 22
    validations:
      required: true

  - type: input
    id: agent
    attributes:
      label: 使用的 agent / preset
      description: 例如 codebuddy、opencode；填设置页里的名字
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: agent 启动命令
      description: 设置页里的 command + args
      placeholder: codebuddy --acp

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从打开会话到报错，一步步写
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: 预期行为 / 实际行为
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 「测试」输出与日志
      description: 贴设置页「测试」结果、设置页「日志」分区、子进程 stderr 尾部。请删掉密钥和 token。
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 截图 / 补充信息
