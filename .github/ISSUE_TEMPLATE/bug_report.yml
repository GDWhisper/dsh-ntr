name: 问题报告 / Bug Report
description: 报告插件运行异常（agent 启动失败、连接断开、界面异常等） / Report plugin runtime problems (agent launch failure, connection drops, UI issues)
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: |
        提 issue 前请先做三件事：
        1. 看 README「常见问题」 / Read the README FAQ.
        2. 搜一下现有 issue，别重复提 / Search existing issues to avoid duplicates.
        3. 到设置页点对应 agent 的「测试」按钮，把结果贴到下面 / Click "Test" for the agent in the settings page and paste the result below.

  - type: checkboxes
    id: checks
    attributes:
      label: 确认 / Confirmation
      options:
        - label: 我已看过 README 常见问题，并搜索过现有 issue / I have read the README FAQ and searched existing issues
          required: true
        - label: 我已用设置页「测试」按钮复现，并附上了结果 / I reproduced with the settings page "Test" button and attached the result
          required: true

  - type: dropdown
    id: area
    attributes:
      label: 问题归属 / Area
      description: 选最接近的一类，帮我们判断是宿主、插件还是 agent 进程的问题 / Pick the closest area to help us locate the problem (DSH host, plugin, or agent process)
      options:
        - agent 启动或 ACP 连接失败 / Agent launch or ACP connection failure
        - 模型、思考等级、配置选项 / Model, thought level, config options
        - 权限审批 / Permission approvals
        - 界面显示 / UI display
        - 内置更新 / Built-in update
        - 其他 / Other
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: 版本与环境 / Versions and environment
      description: dsh-ntr 版本、DSH 宿主版本、操作系统、Node 版本（例如 0.4.4 · DSH 0.1.7 · Windows 11 · Node 22） / dsh-ntr version, DSH host version, OS, Node version (e.g. 0.4.4 · DSH 0.1.7 · Windows 11 · Node 22)
    validations:
      required: true

  - type: input
    id: agent
    attributes:
      label: 使用的 agent 或 preset / Agent or preset
      description: 例如 codebuddy、opencode；填设置页里的名字 / For example codebuddy or opencode; use the name shown in the settings page
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: agent 启动命令 / Agent launch command
      description: 设置页里的 command + args / The command + args from the settings page
      placeholder: codebuddy --acp

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: 从打开会话到报错，一步步写 / Describe step by step, from opening the session to the error
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: 预期行为与实际行为 / Expected and actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 「测试」输出与日志 / "Test" output and logs
      description: 贴设置页「测试」结果、设置页「日志」分区、子进程 stderr 尾部。请删掉密钥和 token。 / Paste the "Test" result, the settings page "Logs" section, and the tail of the subprocess stderr. Remove any keys and tokens.
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 截图或补充信息 / Screenshots or additional context
