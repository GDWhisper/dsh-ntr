name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Rehearse the release without publishing'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Verify (typecheck + tests + build)
        run: npm run prepack

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION"
            exit 1
          fi

      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Pin latest to the version just published
        if: ${{ !inputs.dry_run }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          for _ in $(seq 1 30); do
            npm view "dsh-ntr@$VERSION" version >/dev/null 2>&1 && break
            sleep 10
          done
          npm view "dsh-ntr@$VERSION" version >/dev/null 2>&1 || {
            echo "::error::dsh-ntr@$VERSION never became available on the registry"
            exit 1
          }
          npm dist-tag add "dsh-ntr@$VERSION" latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish (rehearsal)
        if: ${{ inputs.dry_run }}
        run: npm publish --access public --provenance --dry-run
